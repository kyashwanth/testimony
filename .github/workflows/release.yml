name: Release

# Publishes a GitHub Release with the extension zip when a version tag is pushed, for example:
#   git tag v2.0.1 && git push origin v2.0.1
# The tag must match "version" in manifest.json and point at a commit on main.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the tag
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest version $version"; exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Run the tests and build the package
        run: ./build.sh

      - name: Create the checksum
        working-directory: dist
        run: sha256sum "testimony-$VERSION.zip" > "testimony-$VERSION.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checksum=$(cut -d' ' -f1 "dist/testimony-$VERSION.zip.sha256")
          cat > notes.md <<NOTES
          ## Testimony $VERSION

          Built by GitHub Actions from commit \`${GITHUB_SHA::7}\` after all tests passed.

          **Try it (unpacked)**
          1. Download \`testimony-$VERSION.zip\` below and unzip it.
          2. Open \`chrome://extensions\`, turn on Developer mode, choose **Load unpacked**, and select the unzipped folder.

          **Verify the download**
          \`\`\`
          sha256  $checksum
          \`\`\`
          NOTES
          # Releases are immutable once published, so create a draft, attach the files, then publish.
          gh release create "$GITHUB_REF_NAME" \
            "dist/testimony-$VERSION.zip" "dist/testimony-$VERSION.zip.sha256" \
            --draft --verify-tag --title "Testimony $VERSION" --notes-file notes.md --generate-notes
          gh release edit "$GITHUB_REF_NAME" --draft=false
